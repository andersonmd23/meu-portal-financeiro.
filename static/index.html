<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CapitalAberto - Terminal de Mercados Globais</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

    <!-- BARRA DE COTAÇÕES ROLANTE SUPERIOR -->
    <div class="ticker-tape-wrapper">
        <div class="tradingview-widget-container">
            <div class="tradingview-widget-container__widget"></div>
            <script type="text/javascript" src="https://tradingview.com" async>
            {
                "symbols": [
                    {"proName": "FOREXCOM:SPXUSD", "title": "S&P 500"},
                    {"proName": "FX_IDC:USDBRL", "title": "Dólar / Real"},
                    {"proName": "FX_IDC:EURBRL", "title": "Euro / Real"},
                    {"proName": "BMFBOVESPA:IBOV", "title": "Ibovespa"},
                    {"proName": "BITSTAMP:BTCUSD", "title": "Bitcoin"}
                ],
                "showSymbolLogo": true, "colorTheme": "light", "isTransparent": false, "displayMode": "adaptive", "locale": "br"
            }
            </script>
        </div>
    </div>

    <!-- NAVEGAÇÃO PRINCIPAL COM O NOME OFICIAL -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">CAPITAL<span>ABERTO</span></div>
            <div class="nav-links">
                <a href="#" class="active">Mercados</a>
                <a href="#">Notícias</a>
                <a href="#">Análise Técnica</a>
                <a href="#">Calendário</a>
            </div>
        </div>
    </nav>

    <div class="portal-container">
        <!-- CONTEÚDO EM GRADE -->
        <div class="portal-grid">
            
            <!-- COLUNA ESQUERDA: COTAÇÕES E GRÁFICO -->
            <div class="main-content-flow">
                
                <!-- PAINEL LOCAL B3 EXPANDIDO -->
                <div class="portal-card-box">
                    <div class="box-header">
                        <h2>📊 Monitoramento em Tempo Real - Bolsa Brasileira (B3)</h2>
                        <button class="btn-action" onclick="window.PortalEngine.atualizarPainel()">Atualizar Dados</button>
                    </div>
                    <div class="market-grid-cards">
                        <!-- PETR4 -->
                        <div class="crypto-card">
                            <div class="card-meta"><span class="t-name">PETR4</span><span class="m-badge">Ações</span></div>
                            <div class="price-display" id="price-PETR4">R$ --,--</div>
                            <div class="card-status"><span id="v-PETR4">--%</span><span class="dot-live"></span></div>
                        </div>
                        <!-- VALE3 -->
                        <div class="crypto-card">
                            <div class="card-meta"><span class="t-name">VALE3</span><span class="m-badge">Ações</span></div>
                            <div class="price-display" id="price-VALE3">R$ --,--</div>
                            <div class="card-status"><span id="v-VALE3">--%</span><span class="dot-live"></span></div>
                        </div>
                        <!-- MGLU3 -->
                        <div class="crypto-card">
                            <div class="card-meta"><span class="t-name">MGLU3</span><span class="m-badge">Ações</span></div>
                            <div class="price-display" id="price-MGLU3">R$ --,--</div>
                            <div class="card-status"><span id="v-MGLU3">--%</span><span class="dot-live"></span></div>
                        </div>
                        <!-- ITUB4 -->
                        <div class="crypto-card">
                            <div class="card-meta"><span class="t-name">ITUB4</span><span class="m-badge">Ações</span></div>
                            <div class="price-display" id="price-ITUB4">R$ --,--</div>
                            <div class="card-status"><span id="v-ITUB4">--%</span><span class="dot-live"></span></div>
                        </div>
                    </div>
                </div>

                <!-- GRÁFICO INTERATIVO DE ALTA PERFORMANCE -->
                <div class="portal-card-box">
                    <div class="box-header"><h2>📈 Terminal de Gráficos Avançados</h2></div>
                    <div class="chart-wrapper-box">
                        <div id="tv_advanced_terminal"></div>
                        <script type="text/javascript" src="https://tradingview.com"></script>
                        <script type="text/javascript">
                        window.addEventListener('DOMContentLoaded', function() {
                            new TradingView.widget({
                                "width": "100%", "height": "100%", "symbol": "BMFBOVESPA:IBOV",
                                "interval": "D", "timezone": "America/Sao_Paulo", "theme": "light",
                                "style": "1", "locale": "br", "container_id": "tv_advanced_terminal"
                            });
                        });
                        </script>
                    </div>
                </div>
            </div>

            <!-- COLUNA DIREITA: SIDEBAR MACROECONÔMICA -->
            <div class="sidebar-flow">
                <!-- PAINEL DE CÂMBIO -->
                <div class="portal-card-box">
                    <div class="box-header"><h2>💵 Câmbio & Renda Fixa</h2></div>
                    <div class="tradingview-widget-container">
                        <script type="text/javascript" src="https://tradingview.com" async>
                        {
                            "colorTheme": "light", "dateRange": "12M", "showChart": false, "locale": "br",
                            "width": "100%", "height": "240",
                            "tabs": [{"title": "Câmbio", "symbols": [{"s": "FX_IDC:USDBRL", "title": "Dólar / Real"}, {"s": "FX_IDC:EURBRL", "title": "Euro / Real"}]}]
                        }
                        </script>
                    </div>
                </div>

                <!-- CALENDÁRIO ECONÔMICO -->
                <div class="portal-card-box">
                    <div class="box-header"><h2>📅 Calendário Econômico Global</h2></div>
                    <div class="tradingview-widget-container">
                        <script type="text/javascript" src="https://tradingview.com" async>
                        { "colorTheme": "light", "width": "100%", "height": "340", "locale": "br", "importanceFilter": "-1,0,1" }
                        </script>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
